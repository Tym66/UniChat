name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install httpx pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to ship hardcoded credentials or device identifiers
        run: |
          # A credential or device identifier baked into a committed file is a
          # release blocker: everything of that kind must come from the
          # environment. Matching on the *assignment* rather than trying to
          # fingerprint each secret's format — an earlier version of this gate
          # tried to pattern-match serial numbers and silently missed one.
          fail=0

          # Only code is checked for credential assignments. Docs legitimately
          # show commands like  grep '^WEKIT_TOKEN=' .env  which would otherwise
          # trip this.
          # *.js matters as much as *.py: the phone-side script cannot read an
          # environment, so its token is a literal by construction — and this
          # gate did not look at .js until a live token had already been
          # published in one. Placeholders are excluded by shape so the
          # deliberately-uneditable device script can still say what to fill in.
          if grep -rnE '(TOKEN|SERIAL|SECRET|PASSWORD|PASSWD|API_?KEY)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{3,}' \
               --include='*.py' --include='*.sh' --include='*.js' . \
               | grep -viE '(YOUR|REPLACE|CHANGE[-_]?ME|PLACEHOLDER|EXAMPLE|xxxx)' ; then
            echo "::error::credential or device id assigned a literal value — read it from the environment instead"
            fail=1
          fi

          # A real wxid is a mix of letters and digits; placeholders are runs of
          # x. Exclude the latter so examples can stay readable.
          if grep -rnE 'wxid_[a-z0-9]{10,}' \
               --include='*.py' --include='*.sh' --include='*.md' \
               --include='*.yml' --include='*.yaml' --include='*.example' . \
               | grep -vE 'wxid_x{4,}' ; then
            echo "::error::real-looking WeChat id committed — use wxid_xxxxxxxx in examples"
            fail=1
          fi

          test "$fail" -eq 0 && echo "no hardcoded secrets found"
          exit "$fail"
